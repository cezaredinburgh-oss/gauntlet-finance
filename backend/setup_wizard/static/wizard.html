<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Sheets setup wizard — Gauntlet Finance</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel2: #243044;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3d9cf0;
      --accent2: #2dd4a8;
      --warn: #f0b429;
      --danger: #f07178;
      --ok: #7fd962;
      --border: #2e3a4d;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #1b3a5c 0%, transparent 50%),
                  radial-gradient(900px 500px at 100% 0%, #16352d 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 80px; }
    h1 { font-size: 1.55rem; margin: 0 0 6px; font-weight: 700; }
    .sub { color: var(--muted); margin-bottom: 22px; }
    .progress {
      height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden;
      margin-bottom: 8px;
    }
    .progress > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .35s ease;
    }
    .progress-label { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
    .steps-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .pill {
      border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); padding: 6px 12px; border-radius: 999px;
      font-size: .78rem; cursor: pointer;
    }
    .pill.active { color: var(--text); border-color: var(--accent); background: #1e3350; }
    .pill.done { color: var(--ok); border-color: #3d6b45; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px 22px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .card h2 { margin: 0 0 10px; font-size: 1.25rem; }
    .card p { color: var(--muted); margin: 0 0 12px; }
    .lead { color: var(--text); font-size: 1.02rem; margin-bottom: 14px; }
    ol.checklist { margin: 0 0 16px; padding-left: 1.2rem; color: var(--text); }
    ol.checklist li { margin: 10px 0; }
    ol.checklist a { color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
    input[type=text], input[type=file], textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    textarea { min-height: 90px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 10px 16px;
      font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #041018;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
    .btn.success { background: var(--accent2); color: #042018; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .banner {
      border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-size: .92rem;
      border: 1px solid var(--border); background: var(--panel2);
    }
    .banner.ok { border-color: #3d6b45; color: var(--ok); }
    .banner.err { border-color: #7a3038; color: #ffb4b8; }
    .banner.warn { border-color: #7a6320; color: var(--warn); }
    .mono {
      font-family: ui-monospace, Consolas, monospace; font-size: .88rem;
      background: var(--bg); padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); word-break: break-all; user-select: all;
    }
    .hidden { display: none !important; }
    .status-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
    }
    @media (max-width: 600px) { .status-grid { grid-template-columns: 1fr; } }
    .stat {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: .88rem;
    }
    .stat b { display: block; color: var(--muted); font-weight: 500; font-size: .75rem; }
    .footer { margin-top: 18px; color: var(--muted); font-size: .8rem; text-align: center; }
    /* Illustrated step cards */
    .viz {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 18px;
    }
    @media (max-width: 640px) { .viz { grid-template-columns: 1fr; } }
    .viz-card {
      background: linear-gradient(160deg, #1e2a3d 0%, #152033 100%);
      border: 1px solid var(--border); border-radius: 12px; padding: 14px;
      min-height: 148px;
    }
    .viz-card h3 {
      margin: 0 0 8px; font-size: .82rem; font-weight: 600; color: var(--accent2);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .viz-card p { margin: 0; font-size: .82rem; color: var(--muted); }
    .viz-svg { width: 100%; height: 72px; margin-bottom: 8px; display: block; }
    .callout {
      display: flex; gap: 12px; align-items: flex-start;
      background: #152033; border: 1px solid #2a4a6a; border-radius: 12px;
      padding: 12px 14px; margin: 12px 0;
    }
    .callout .n {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); color: #041018; font-weight: 700;
      display: grid; place-items: center; font-size: .9rem;
    }
    .callout div { font-size: .9rem; color: var(--text); }
    .callout span { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
    details.advanced {
      margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px;
    }
    details.advanced summary {
      cursor: pointer; color: var(--muted); font-size: .9rem; font-weight: 600;
    }
    .tip {
      font-size: .85rem; color: var(--muted); margin-top: 10px;
      border-left: 3px solid var(--accent); padding-left: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Connect Google Sheets</h1>
    <p class="sub">
      One guided path for new users: create a private spreadsheet “database” and link it to Gauntlet.
      No coding required — about 10–15 minutes.
    </p>

    <div class="progress"><i id="bar"></i></div>
    <div class="progress-label" id="progressLabel">Loading…</div>
    <div class="steps-nav" id="pills"></div>

    <div class="card" id="panel"></div>
    <div class="footer">Google Sheets setup wizard · secrets stay on your machine · never commit keys to git</div>
  </div>

  <script>
    /** Main path: connect sheet + local ready. Deploy is optional (advanced). */
    const STEPS = [
      { key: "welcome", title: "Welcome" },
      { key: "cloud", title: "1 · Google Cloud" },
      { key: "key", title: "2 · Access key" },
      { key: "sheet", title: "3 · Spreadsheet" },
      { key: "share", title: "4 · Share & test" },
      { key: "tabs", title: "5 · Prepare ledger" },
      { key: "ready", title: "6 · App ready" },
      { key: "done", title: "Done" },
    ];
    let step = 0;
    let status = null;
    let busy = false;

    const $ = (id) => document.getElementById(id);

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const text = await r.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { detail: text }; }
      if (!r.ok) {
        const d = data.detail;
        const msg = typeof d === "string" ? d : (d && JSON.stringify(d)) || data.message || r.statusText;
        throw new Error(msg);
      }
      return data;
    }

    async function refreshStatus() {
      status = await api("/setup/api/status");
      render();
    }

    function setProgress() {
      const p = status?.progress?.percent ?? 0;
      $("bar").style.width = p + "%";
      $("progressLabel").textContent = status?.progress?.ready
        ? "Ready — spreadsheet connected and ledger tabs OK"
        : `Progress: ${status?.progress?.auto_steps_done ?? 0}/4 automatic checks · ${p}%`;
    }

    function pills() {
      const el = $("pills");
      el.innerHTML = "";
      STEPS.forEach((s, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (i === step ? " active" : "");
        if (i === 2 && status?.steps?.service_account?.done) b.classList.add("done");
        if (i === 3 && status?.steps?.spreadsheet?.done) b.classList.add("done");
        if (i === 4 && status?.steps?.share?.done) b.classList.add("done");
        if (i === 5 && status?.steps?.tabs?.done) b.classList.add("done");
        if (i === 6 && status?.progress?.ready) b.classList.add("done");
        b.textContent = s.title;
        b.onclick = () => { step = i; render(); };
        el.appendChild(b);
      });
    }

    function banner(type, html) {
      return `<div class="banner ${type}">${html}</div>`;
    }

    function nav(prev = true, next = true, nextLabel = "Continue") {
      return `<div class="nav">
        <button type="button" class="btn secondary" ${prev ? "" : "disabled"} data-act="prev">Back</button>
        <button type="button" class="btn" ${next ? "" : "disabled"} data-act="next">${nextLabel}</button>
      </div>`;
    }

    /* ---- Simple illustrated cards (theme-native, not fragile Console screenshots) ---- */
    function vizCloud() {
      return `<div class="viz">
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="8" y="10" width="184" height="52" rx="8" fill="#0f1419" stroke="#3d4f66"/>
            <rect x="20" y="22" width="70" height="10" rx="3" fill="#3d9cf0" opacity=".85"/>
            <rect x="20" y="38" width="100" height="8" rx="2" fill="#2e3a4d"/>
            <circle cx="160" cy="36" r="14" fill="#1e3350" stroke="#3d9cf0"/>
            <text x="160" y="40" text-anchor="middle" fill="#3d9cf0" font-size="12" font-family="Segoe UI">API</text>
          </svg>
          <h3>Turn on two switches</h3>
          <p>In Google Cloud, enable <b>Sheets API</b> and <b>Drive API</b> so Gauntlet may talk to your sheet.</p>
        </div>
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="30" y="14" width="140" height="44" rx="6" fill="#152033" stroke="#2dd4a8"/>
            <text x="100" y="40" text-anchor="middle" fill="#2dd4a8" font-size="11" font-family="Segoe UI">gauntlet-finance</text>
          </svg>
          <h3>One project is enough</h3>
          <p>Name it anything you like (e.g. gauntlet-finance). You only do this once.</p>
        </div>
      </div>`;
    }

    function vizKey() {
      return `<div class="viz">
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <circle cx="48" cy="36" r="18" fill="#1e3350" stroke="#3d9cf0"/>
            <text x="48" y="40" text-anchor="middle" fill="#e7ecf3" font-size="10">bot</text>
            <rect x="80" y="24" width="100" height="24" rx="6" fill="#0f1419" stroke="#f0b429"/>
            <text x="130" y="40" text-anchor="middle" fill="#f0b429" font-size="10">JSON key</text>
          </svg>
          <h3>Robot helper</h3>
          <p>A “service account” is a robot Google user. Gauntlet uses its key to read/write your sheet.</p>
        </div>
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="40" y="16" width="120" height="40" rx="8" fill="#152033" stroke="#3d9cf0" stroke-dasharray="4 3"/>
            <text x="100" y="40" text-anchor="middle" fill="#9aa8bc" font-size="11">Drop .json here</text>
          </svg>
          <h3>Upload in this page</h3>
          <p>After Google downloads a JSON file, upload it below. We save it only under <code>secrets/</code>.</p>
        </div>
      </div>`;
    }

    function vizSheet() {
      return `<div class="viz">
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="24" y="12" width="152" height="48" rx="4" fill="#0f3d2e" stroke="#2dd4a8"/>
            <line x1="24" y1="28" x2="176" y2="28" stroke="#2dd4a8" opacity=".4"/>
            <line x1="70" y1="12" x2="70" y2="60" stroke="#2dd4a8" opacity=".35"/>
            <line x1="120" y1="12" x2="120" y2="60" stroke="#2dd4a8" opacity=".35"/>
          </svg>
          <h3>Your cloud notebook</h3>
          <p>The spreadsheet is Gauntlet’s database — private to you, editable in Google Sheets anytime.</p>
        </div>
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="50" y="20" width="100" height="32" rx="8" fill="#2dd4a8"/>
            <text x="100" y="40" text-anchor="middle" fill="#042018" font-size="11" font-weight="700">Create for me</text>
          </svg>
          <h3>Recommended</h3>
          <p>One click creates the sheet with the robot. Paste your Gmail so you can open it in the browser.</p>
        </div>
      </div>`;
    }

    function vizShare() {
      return `<div class="viz">
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <circle cx="50" cy="36" r="16" fill="#1e3350" stroke="#e7ecf3"/>
            <text x="50" y="40" text-anchor="middle" fill="#e7ecf3" font-size="9">you</text>
            <path d="M70 36 H120" stroke="#3d9cf0" stroke-width="2" marker-end="url(#a)"/>
            <circle cx="150" cy="36" r="16" fill="#1e3350" stroke="#3d9cf0"/>
            <text x="150" y="40" text-anchor="middle" fill="#3d9cf0" font-size="9">bot</text>
          </svg>
          <h3>Share as Editor</h3>
          <p>If you created the sheet yourself, invite the robot email with role <b>Editor</b> (not Viewer).</p>
        </div>
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <circle cx="100" cy="36" r="20" fill="#16352d" stroke="#7fd962"/>
            <path d="M88 36 l8 8 16-18" fill="none" stroke="#7fd962" stroke-width="3"/>
          </svg>
          <h3>Test connection</h3>
          <p>Use the button below. Green means Gauntlet can open the sheet with the key you uploaded.</p>
        </div>
      </div>`;
    }

    function vizTabs() {
      return `<div class="viz">
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="16" y="18" width="50" height="36" rx="4" fill="#243044"/>
            <rect x="74" y="18" width="50" height="36" rx="4" fill="#243044"/>
            <rect x="132" y="18" width="50" height="36" rx="4" fill="#243044"/>
            <text x="41" y="40" text-anchor="middle" fill="#9aa8bc" font-size="8">Tx</text>
            <text x="99" y="40" text-anchor="middle" fill="#9aa8bc" font-size="8">Lots</text>
            <text x="157" y="40" text-anchor="middle" fill="#9aa8bc" font-size="8">…</text>
          </svg>
          <h3>Blank pages → ledger</h3>
          <p>“Prepare ledger” creates all required tabs and starter categories in one click.</p>
        </div>
        <div class="viz-card">
          <svg class="viz-svg" viewBox="0 0 200 72" aria-hidden="true">
            <rect x="40" y="22" width="120" height="28" rx="8" fill="#2dd4a8"/>
            <text x="100" y="40" text-anchor="middle" fill="#042018" font-size="11" font-weight="700">Safe to re-run</text>
          </svg>
          <h3>Idempotent</h3>
          <p>Running prepare again will not wipe your data — it only fills missing structure.</p>
        </div>
      </div>`;
    }

    function renderPanel() {
      const L = status?.links || {};
      const sa = status?.service_account_email;
      const conn = status?.connection || {};
      let html = "";

      if (step === 0) {
        html = `
          <h2>Welcome</h2>
          <p class="lead">Gauntlet stores your finance data in <b>your</b> Google Spreadsheet — not on our servers.</p>
          <p>This wizard helps you:</p>
          <ol class="checklist">
            <li>Turn on Google Sheets access in Google Cloud</li>
            <li>Create a private “robot” key and save it safely</li>
            <li>Create (or connect) a spreadsheet</li>
            <li>Prepare the ledger tabs so the app can work</li>
          </ol>
          <div class="status-grid">
            <div class="stat"><b>Access key</b>${status?.credentials_found ? "✅ Ready" : "❌ Still needed"}</div>
            <div class="stat"><b>Spreadsheet</b>${status?.spreadsheet_id ? "✅ Linked" : "❌ Not linked"}</div>
            <div class="stat"><b>Connection</b>${conn.connected ? "✅ Works" : "❌ Not yet"}</div>
            <div class="stat"><b>Ledger tabs</b>${conn.ok ? "✅ Ready" : "❌ Incomplete"}</div>
          </div>
          ${conn.error ? banner("warn", "Last check: " + escapeHtml(conn.error)) : ""}
          <p class="tip">You need a normal Google account and about 10–15 minutes. Keep this tab open while you work in Google Cloud.</p>
          ${nav(false, true, status?.progress?.ready ? "Review setup" : "Start setup")}`;
      }

      if (step === 1) {
        html = `
          <h2>Step 1 — Google Cloud (one-time)</h2>
          <p class="lead">Think of Google Cloud as the control panel that allows apps to use Sheets safely.</p>
          ${vizCloud()}
          <div class="callout"><div class="n">1</div><div>Open <a href="${L.create_project}" target="_blank" rel="noopener">Create a project</a><span>Name it e.g. gauntlet-finance → Create. Select it in the top bar.</span></div></div>
          <div class="callout"><div class="n">2</div><div>Enable <a href="${L.sheets_api}" target="_blank" rel="noopener">Google Sheets API</a><span>Click Enable if it is not already on.</span></div></div>
          <div class="callout"><div class="n">3</div><div>Enable <a href="${L.drive_api}" target="_blank" rel="noopener">Google Drive API</a><span>Needed so the wizard can create a spreadsheet for you.</span></div></div>
          <p class="tip">More links: <a href="${L.api_library}" target="_blank" rel="noopener">API Library</a> · <a href="${L.credentials}" target="_blank" rel="noopener">Credentials</a></p>
          <label style="margin-top:14px"><input type="checkbox" id="chkCloud" /> I created the project and enabled both APIs</label>
          ${nav(true, true)}`;
      }

      if (step === 2) {
        html = `
          <h2>Step 2 — Access key (service account)</h2>
          <p class="lead">Create a robot identity, download its key file, and upload it here.</p>
          ${vizKey()}
          <ol class="checklist">
            <li>Open <a href="${L.credentials}" target="_blank" rel="noopener">Credentials</a>.</li>
            <li><b>Create credentials → Service account</b> → name <code>finance-sheets</code> → Done.</li>
            <li>Click the new account → <b>Keys → Add key → Create new key → JSON</b>.</li>
            <li>Upload the downloaded file below.</li>
          </ol>
          ${sa
            ? banner("ok", "Key loaded. Robot email (you may need it for Share):<div class='mono' style='margin-top:8px' id='saEmail'>" + escapeHtml(sa) + "</div><button type='button' class='btn secondary' style='margin-top:8px' data-act='copy-sa'>Copy email</button>")
            : banner("warn", "No valid key detected yet — upload the JSON file.")}
          ${status?.steps?.service_account?.error ? banner("err", escapeHtml(status.steps.service_account.error)) : ""}
          <div class="row" style="flex-direction:column;align-items:stretch">
            <div>
              <label>Upload JSON key file</label>
              <input type="file" id="keyFile" accept=".json,application/json" />
            </div>
            <button type="button" class="btn" data-act="upload-key" ${busy ? "disabled" : ""}>Save key</button>
          </div>
          <p class="tip">Saved as <code>${escapeHtml(status?.credentials_path || "secrets/service-account.json")}</code> — never email or commit this file.</p>
          ${nav(true, !!sa)}`;
      }

      if (step === 3) {
        html = `
          <h2>Step 3 — Spreadsheet</h2>
          <p class="lead">This is your private finance notebook in the cloud.</p>
          ${vizSheet()}
          <div class="row" style="flex-direction:column;align-items:stretch">
            <label>Your Gmail (so you can open the sheet in Google)</label>
            <input type="text" id="shareEmail" placeholder="you@gmail.com" />
            <label>Sheet title</label>
            <input type="text" id="sheetTitle" value="Gauntlet Finance Data" />
            <button type="button" class="btn success" data-act="create-sheet" ${busy || !sa ? "disabled" : ""}>
              Create spreadsheet for me
            </button>
            ${!sa ? banner("warn", "Upload an access key first (step 2).") : ""}
          </div>
          <hr style="border:0;border-top:1px solid var(--border);margin:18px 0" />
          <p style="font-size:.9rem">Already have a sheet? Paste its URL or ID:</p>
          <label>Spreadsheet URL or ID</label>
          <input type="text" id="sheetId" placeholder="https://docs.google.com/spreadsheets/d/…" value="${escapeHtml(status?.spreadsheet_id || "")}" />
          <div class="row">
            <button type="button" class="btn secondary" data-act="save-sheet">Save link</button>
            <a class="btn ghost" href="${L.new_sheet || "https://sheets.google.com"}" target="_blank" rel="noopener">Open blank sheet</a>
          </div>
          <div id="sheetMsg"></div>
          ${status?.spreadsheet_id ? banner("ok", "Linked ID: <code>" + escapeHtml(status.spreadsheet_id) + "</code>") : banner("warn", "No spreadsheet linked yet.")}
          ${nav(true, !!status?.spreadsheet_id)}`;
      }

      if (step === 4) {
        html = `
          <h2>Step 4 — Share &amp; test</h2>
          <p class="lead">Google treats the robot as a separate user. It needs Editor access (unless you used “Create for me”, which often shares for you).</p>
          ${vizShare()}
          ${sa
            ? `<p>Invite this email on the sheet:</p><div class="mono" id="saEmail2">${escapeHtml(sa)}</div>
              <div class="row">
                <button type="button" class="btn secondary" data-act="copy-sa2">Copy email</button>
                <a class="btn ghost" href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(status?.spreadsheet_id || "")}/edit" target="_blank" rel="noopener">Open sheet</a>
              </div>`
            : banner("err", "Upload an access key first (step 2).")}
          <ol class="checklist">
            <li>In Google Sheets click <b>Share</b> (top right).</li>
            <li>Paste the robot email → role <b>Editor</b>.</li>
            <li>Uncheck “Notify people” if you like → Share.</li>
            <li>Click <b>Test connection</b> below.</li>
          </ol>
          <div class="row">
            <button type="button" class="btn" data-act="test-conn">Test connection</button>
          </div>
          <div id="shareMsg"></div>
          ${conn.connected ? banner("ok", "Connection works — Gauntlet can open your spreadsheet.") : ""}
          ${conn.error && !conn.connected ? banner("err", escapeHtml(conn.error)) : ""}
          ${nav(true, !!conn.connected)}`;
      }

      if (step === 5) {
        const missing = (conn.missing_tabs || []).join(", ") || "none";
        html = `
          <h2>Step 5 — Prepare ledger</h2>
          <p class="lead">Create the tabs and starter categories Gauntlet expects (transactions, lots, categories, …).</p>
          ${vizTabs()}
          <div class="status-grid">
            <div class="stat"><b>Missing tabs</b>${escapeHtml(missing)}</div>
            <div class="stat"><b>Tabs found</b>${(conn.tabs || []).length}</div>
          </div>
          <div class="row">
            <button type="button" class="btn success" data-act="prepare-ledger">Prepare ledger now</button>
            <button type="button" class="btn secondary" data-act="ensure-tabs">Tabs only</button>
          </div>
          <div id="tabsMsg"></div>
          ${conn.ok ? banner("ok", "All required tabs are present.") : banner("warn", "Tabs not complete yet — click Prepare ledger.")}
          ${nav(true, !!conn.ok)}`;
      }

      if (step === 6) {
        const ready = !!(conn.connected && conn.ok);
        html = `
          <h2>Step 6 — App ready check</h2>
          <p class="lead">Confirm the API sees your sheet, then open the main Gauntlet UI.</p>
          <div class="status-grid">
            <div class="stat"><b>API health</b><a href="/health" target="_blank" rel="noopener">Open /health</a></div>
            <div class="stat"><b>Sheets status</b><a href="/sheets/status" target="_blank" rel="noopener">Open /sheets/status</a></div>
            <div class="stat"><b>Connected</b>${conn.connected ? "✅ Yes" : "❌ No"}</div>
            <div class="stat"><b>Ledger tabs</b>${conn.ok ? "✅ Ready" : "❌ Incomplete"}</div>
          </div>
          <div class="row" style="margin-top:14px">
            <button type="button" class="btn" data-act="test-conn">Re-test connection</button>
            <a class="btn success" href="http://127.0.0.1:5190/" target="_blank" rel="noopener">Open Gauntlet UI</a>
            <a class="btn ghost" href="/docs" target="_blank" rel="noopener">API docs</a>
          </div>
          <div id="shareMsg"></div>
          <p class="tip">Tip: double-click <code>Start-App.bat</code> to run API + UI together. Next in the app: <b>Upload</b> a bank statement.</p>
          ${ready ? banner("ok", "Local setup looks ready.") : banner("warn", "Finish connection and ledger steps before relying on the app.")}
          ${nav(true, ready, "Finish")}
          <details class="advanced">
            <summary>Optional: put the app on the internet later (GitHub / Railway)</summary>
            <p style="margin-top:10px">Not required for local use. See <code>docs/DEPLOY.md</code> and use
              <code>scripts\\Prepare-GitHub.bat</code> when you are ready. Never upload <code>secrets/</code> or <code>.env</code>.</p>
            <div class="row">
              <button type="button" class="btn secondary" data-act="deploy-env">Generate deploy env vars</button>
            </div>
            <input type="text" id="publicUrl" placeholder="https://your-app.up.railway.app (optional)" style="margin-top:8px" />
            <div id="deployMsg"></div>
            <textarea id="deployEnv" class="hidden" readonly style="min-height:140px;margin-top:10px"></textarea>
          </details>`;
      }

      if (step === 7) {
        html = `
          <h2>${status?.progress?.ready ? "You’re connected 🎉" : "Almost there"}</h2>
          ${status?.progress?.ready
            ? banner("ok", "Google Sheets is linked. Import statements in the app to build your ledger.")
            : banner("warn", "Setup incomplete — use Back to finish the remaining steps.")}
          <div class="status-grid">
            <div class="stat"><b>Spreadsheet</b>${escapeHtml(status?.spreadsheet_id || "—")}</div>
            <div class="stat"><b>Robot email</b>${escapeHtml(sa || "—")}</div>
            <div class="stat"><b>Connected</b>${conn.connected ? "yes" : "no"}</div>
            <div class="stat"><b>Tabs OK</b>${conn.ok ? "yes" : "no"}</div>
          </div>
          <div class="row" style="margin-top:16px">
            <a class="btn" href="http://127.0.0.1:5190/" target="_blank" rel="noopener">Open Gauntlet UI</a>
            <a class="btn secondary" href="/health" target="_blank" rel="noopener">Health</a>
            <button type="button" class="btn ghost" data-act="refresh">Refresh status</button>
          </div>
          <p class="tip">Next: Upload a Revolut / Raiffeisen / eToro statement → Categorize → check Investments.</p>
          ${nav(true, false)}`;
      }

      $("panel").innerHTML = html;
      bindPanel();
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function bindPanel() {
      $("panel").querySelectorAll("[data-act]").forEach(btn => {
        btn.addEventListener("click", onAction);
      });
    }

    async function onAction(ev) {
      const act = ev.currentTarget.getAttribute("data-act");
      if (act === "prev") { step = Math.max(0, step - 1); render(); return; }
      if (act === "next") {
        if (step === 1) {
          const chk = document.getElementById("chkCloud");
          if (chk && !chk.checked) {
            alert("Please confirm you enabled the APIs (check the box).");
            return;
          }
        }
        step = Math.min(STEPS.length - 1, step + 1);
        render();
        return;
      }
      if (act === "refresh") { await refreshStatus(); return; }
      if (act === "copy-sa" || act === "copy-sa2") {
        const t = status?.service_account_email;
        if (t) {
          await navigator.clipboard.writeText(t);
          alert("Copied: " + t);
        }
        return;
      }
      if (act === "upload-key") {
        const f = document.getElementById("keyFile")?.files?.[0];
        if (!f) { alert("Choose a JSON file first."); return; }
        const fd = new FormData();
        fd.append("file", f);
        busy = true; render();
        try {
          await api("/setup/api/upload-credentials", { method: "POST", body: fd });
          await refreshStatus();
          alert("Key saved.");
        } catch (e) {
          alert("Upload failed: " + e.message);
          busy = false; render();
        }
        busy = false;
        return;
      }
      if (act === "save-sheet") {
        const raw = document.getElementById("sheetId")?.value || "";
        busy = true;
        try {
          await api("/setup/api/save-spreadsheet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ spreadsheet_id: raw }),
          });
          await refreshStatus();
        } catch (e) {
          alert("Save failed: " + e.message);
        }
        busy = false; render();
        return;
      }
      if (act === "create-sheet") {
        const title = document.getElementById("sheetTitle")?.value || "Gauntlet Finance Data";
        const share = document.getElementById("shareEmail")?.value || "";
        busy = true; render();
        try {
          const r = await api("/setup/api/create-spreadsheet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, share_with_email: share }),
          });
          await refreshStatus();
          busy = false;
          render();
          const m2 = document.getElementById("sheetMsg");
          if (m2) {
            m2.innerHTML = banner("ok", escapeHtml(r.message || "Created.") +
              (r.url ? ` <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">Open sheet</a>` : ""));
          }
        } catch (e) {
          busy = false; render();
          const m2 = document.getElementById("sheetMsg");
          if (m2) m2.innerHTML = banner("err", escapeHtml(e.message));
          else alert(e.message);
        }
        return;
      }
      if (act === "prepare-ledger") {
        const msg = document.getElementById("tabsMsg");
        if (msg) msg.innerHTML = banner("warn", "Preparing ledger…");
        try {
          const r = await api("/setup/api/prepare-ledger", { method: "POST" });
          await refreshStatus();
          const m = document.getElementById("tabsMsg");
          if (m) m.innerHTML = banner(r.ok ? "ok" : "err", escapeHtml(r.message || JSON.stringify(r)));
        } catch (e) {
          const m = document.getElementById("tabsMsg");
          if (m) m.innerHTML = banner("err", escapeHtml(e.message));
        }
        return;
      }
      if (act === "deploy-env") {
        const url = document.getElementById("publicUrl")?.value || "";
        const msg = document.getElementById("deployMsg");
        const ta = document.getElementById("deployEnv");
        if (msg) msg.innerHTML = banner("warn", "Building env…");
        try {
          const q = url ? ("?public_url=" + encodeURIComponent(url)) : "";
          const r = await api("/setup/api/deploy-env" + q);
          if (ta) {
            ta.classList.remove("hidden");
            ta.value = r.env_file_text || "";
          }
          if (msg) msg.innerHTML = banner(r.ok ? "ok" : "warn", escapeHtml(r.message || ""));
        } catch (e) {
          if (msg) msg.innerHTML = banner("err", escapeHtml(e.message));
        }
        return;
      }
      if (act === "test-conn") {
        const msg = document.getElementById("shareMsg");
        if (msg) msg.innerHTML = banner("warn", "Testing…");
        try {
          const r = await api("/setup/api/test-connection", { method: "POST" });
          await refreshStatus();
          const m = document.getElementById("shareMsg");
          if (m) m.innerHTML = r.ok
            ? banner("ok", escapeHtml(r.message || "Connected."))
            : banner("err", escapeHtml(r.message || r.error || "Failed"));
        } catch (e) {
          const m = document.getElementById("shareMsg");
          if (m) m.innerHTML = banner("err", escapeHtml(e.message));
        }
        return;
      }
      if (act === "ensure-tabs") {
        const msg = document.getElementById("tabsMsg");
        if (msg) msg.innerHTML = banner("warn", "Creating tabs…");
        try {
          const r = await api("/setup/api/ensure-tabs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ seed: false }),
          });
          await refreshStatus();
          const m = document.getElementById("tabsMsg");
          if (m) m.innerHTML = banner(r.ok ? "ok" : "err", escapeHtml(r.message || JSON.stringify(r)));
        } catch (e) {
          const m = document.getElementById("tabsMsg");
          if (m) m.innerHTML = banner("err", escapeHtml(e.message));
        }
      }
    }

    function render() {
      setProgress();
      pills();
      renderPanel();
    }

    refreshStatus().catch(e => {
      $("panel").innerHTML = banner("err", "Could not load wizard status: " + escapeHtml(e.message) +
        ". Is the API running on this host?");
    });
  </script>
</body>
</html>
